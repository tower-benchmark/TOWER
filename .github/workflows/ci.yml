name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes the previous run for the same PR or branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TOWER_REQUIRE_PUBLIC_DATA: "1"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    env:
      # .python-version pins 3.11 for local work; the matrix must override it for uv.
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: false
      - name: Fetch pinned public XPolicyLab code
        env:
          # CPU integration uses code only; skip unrelated policy assets.
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          git submodule update --init --depth 1 third_party/XPolicyLab
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.13.7"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --all-packages
      - name: Assert the matrix interpreter is in use
        run: uv run --no-sync python -c "import sys; assert '%d.%d' % sys.version_info[:2] == '${{ matrix.python }}', sys.version"
      - run: uv lock --check
      - run: python -m reproduction.paper_metrics verify
      - run: python tools/verify_asset_closure.py hf-assets --manifest hf-assets/manifest.json --manifest-only
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync python tools/simulator/benchmark.py verify
      - run: uv run --no-sync tower smoke
      - name: XPolicyLab CPU loopback
        run: uv run --no-sync tower smoke --policy xpolicylab://demo_policy
      - run: uv run --no-sync pyright
      - name: Record runner CPU identity
        run: |
          lscpu | grep -E 'Model name|Flags' | head -2
          echo "CPUs: $(nproc)"
      - name: Fetch public golden recordings by pinned hash
        run: uv run --no-sync python -m scripts.maintainer.fetch_golden
      - name: Fetch public scene and asset fixtures by pinned hash
        run: uv run --no-sync python -m scripts.maintainer.fetch_public_test_data
      - run: uv run --no-sync pytest -rx -n auto
      - name: Characterization on the NumPy version matching Isaac 6.1
        if: matrix.python == '3.12'
        run: uv run --no-sync --with numpy==2.3.1 --with scipy==1.17.0 pytest tests/characterization -q -n auto
      - run: uv run --no-sync --with usd-core==26.8 pytest tools/simulator/tests/test_material_contract.py
      - run: uv build --package nero-kinematics
      - run: uv build --package tower-eval
      - run: uv build --package tower-sim
      - name: Check public tree and wheels
        run: |
          args=()
          for wheel in dist/*.whl; do args+=(--wheel "$wheel"); done
          uv run --no-sync python -m scripts.maintainer.check_public_tree "${args[@]}"
      - name: Import isolated wheels without native simulator modules
        run: |
          wheel_env=$(mktemp -d)
          trap 'rm -rf "$wheel_env"' EXIT
          uv venv --python "${{ matrix.python }}" "$wheel_env/venv"
          uv pip install --python "$wheel_env/venv/bin/python" dist/*.whl
          cd "$wheel_env"
          env -u PYTHONPATH "$wheel_env/venv/bin/python" -c "import importlib,pkgutil,sys,tower_sim,tower_eval; [importlib.import_module(m.name) for m in pkgutil.walk_packages(tower_sim.__path__, 'tower_sim.')]; assert not {'isaacsim','omni','pxr','carb','pinocchio','casadi','jenga_generator'} & set(sys.modules)"

  native-eef:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -el {0}
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      TOWER_REQUIRE_NATIVE_IK: "1"
      TOWER_NERO_URDF: ${{ github.workspace }}/packages/nero-kinematics/src/nero_kinematics/models/nero_sim_reference.urdf
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-file: packages/nero-kinematics/environment.yml
          cache-environment: true
          init-shell: bash
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.13.7"
      - name: Build and install reviewed packages
        run: |
          python -c 'import pinocchio.casadi, casadi'
          uv build --package tower-eval --out-dir dist/tower
          uv build --package nero-kinematics --out-dir dist/nero
          uv build --package tower-sim --out-dir dist/sim
          python -m pip install dist/tower/*.whl dist/nero/*.whl dist/sim/*.whl 'pytest>=8,<9' 'h5py>=3.11,<4' 'pyyaml>=6,<7' 'pillow>=10,<13' 'qpsolvers==4.8.1' 'quadprog==0.1.13' 'loop-rate-limiters==1.2.0'
          # Keep conda's pinned Pinocchio with CasADi bindings; Pink's PyPI pin dependency is a different build.
          python -m pip install --no-deps -r packages/nero-kinematics/requirements-pink.txt
      - name: Fetch pinned public test inputs
        run: |
          python -m scripts.maintainer.fetch_golden
          python -m scripts.maintainer.fetch_public_test_data
      - name: Run native and installed-package regression tests
        run: |
          # test_bench_scoring.py is pure-Python campaign scoring with no native
          # dependency; the quality jobs run it. Native jobs keep the IK-relevant tests.
          python -m pytest src/tower-eval/tests/unit/kinematics tools/tests packages/nero-kinematics/tests packages/tower-sim/tests tests/characterization/test_ik.py --ignore=packages/tower-sim/tests/test_bench_scoring.py --junitxml=dist/eef-tests.xml
          python packages/nero-kinematics/examples/offline_check.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: native-eef-validation
          path: dist/

  benchmark-ik:
    name: Frozen benchmark IK environment
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -el {0}
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      TOWER_REQUIRE_NATIVE_IK: "1"
      TOWER_NERO_URDF: ${{ github.workspace }}/packages/nero-kinematics/src/nero_kinematics/models/nero_sim_reference.urdf
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-file: configs/benchmark-ik.yml
          cache-environment: true
          init-shell: bash
      - name: Install test harness without replacing frozen solver dependencies
        run: |
          python -m pip install 'pytest>=8,<9' 'h5py>=3.11,<4' 'pyyaml>=6,<7' 'pillow>=10,<13' 'loop-rate-limiters==1.2.0'
          python -m pip install --no-deps -r packages/nero-kinematics/requirements-pink.txt
          python -m pip install --no-deps ./packages/nero-kinematics ./src/tower-eval ./packages/tower-sim
      - name: Fetch pinned public test inputs
        run: |
          python -m scripts.maintainer.fetch_golden
          python -m scripts.maintainer.fetch_public_test_data
      - name: Run all IK characterization cases in the benchmark environment
        # Pure-Python campaign scoring replays run in the quality jobs.
        run: python -m pytest tests/characterization/test_ik.py packages/nero-kinematics/tests packages/tower-sim/tests --ignore=packages/tower-sim/tests/test_bench_scoring.py -ra --junitxml=benchmark-ik-tests.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: benchmark-ik-validation
          path: benchmark-ik-tests.xml
