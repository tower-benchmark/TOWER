version: 2
updates:
  # uv owns the pip dependencies and lock for all three workspace packages.
  # Updates cover the workspace lock and GitHub Actions.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # Native solver changes need separate validation against the frozen IK environments.
    ignore:
      - dependency-name: casadi
    groups:
      python-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    open-pull-requests-limit: 5
