[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "tower-sim"
version = "0.1.0"
description = "TOWER simulation benchmark control and kinematics boundary"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
dependencies = ["pillow>=10,<13", "pyyaml>=6,<7", "h5py>=3.11,<4", "numpy>=1.26,<3", "scipy>=1.11,<2", "nero-kinematics>=0.2,<0.3", "tower-eval>=0.1,<0.2"]

[project.optional-dependencies]
evidence = []

[tool.uv.sources]
nero-kinematics = { workspace = true }
tower-eval = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/tower_sim"]
