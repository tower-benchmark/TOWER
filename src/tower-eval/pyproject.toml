[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tower-eval"
version = "0.1.0"
description = "Open TOWER robotics simulation evaluator"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "nero-kinematics>=0.2,<0.3",
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "gymnasium>=1.0,<2",
]

[project.optional-dependencies]
xpolicylab = ["websockets>=15,<16", "msgpack>=1.0.8", "msgpack-numpy>=0.4.8", "pydantic>=2.11,<3", "pillow>=10,<13"]
# Pinocchio CasADi bindings are provisioned with conda; PyPI pin requires NumPy 2.
eef = ["nero-kinematics[eef]>=0.2,<0.3"]
artifacts = ["h5py>=3.11,<4", "av>=14,<17", "opencv-python-headless>=4.10,<4.12"]
dev = ["pytest>=8,<9", "websockets>=15,<16", "h5py>=3.11,<4", "av>=14,<17", "opencv-python-headless>=4.10,<4.12"]

[project.scripts]
tower = "tower_eval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tower_eval"]

[tool.hatch.build.targets.wheel.force-include]
"examples/random_policy" = "tower_eval/examples/random_policy"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.hooks.custom]

[tool.uv.sources]
nero-kinematics = { workspace = true }
